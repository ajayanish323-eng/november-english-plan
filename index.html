<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>November English Plan 2026 – Preschool</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a4c;--mut:#6b6a85;--h:200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b33;--card:#2a2950;--ink:#f6f3ff;--mut:#b9b7d9}}
:root[data-theme="dark"]{--bg:#1c1b33;--card:#2a2950;--ink:#f6f3ff;--mut:#b9b7d9}
html{height:100%;min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#app{position:relative;height:100vh;height:100dvh;min-height:0}
.slide{position:absolute;inset:0 0 58px 0;padding:16px 4vw;overflow-y:auto;overflow-x:hidden;animation:in .55s cubic-bezier(.2,1.3,.4,1);background:radial-gradient(circle at 85% 8%,hsl(var(--h) 85% 80%/.55),transparent 60%),radial-gradient(circle at 5% 100%,hsl(calc(var(--h) + 60) 85% 80%/.4),transparent 55%)}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.97)}}
h1{font-size:clamp(24px,4.2vw,46px);margin:4px 0 8px;line-height:1.1}h2{font-size:clamp(20px,3vw,32px);margin:8px 0}h3{margin:12px 0 6px}
small,.mut{color:var(--mut);font-weight:400}
.wk{display:inline-block;background:hsl(var(--h) 80% 55%);color:#fff;padding:3px 14px;border-radius:99px;font-size:14px;font-weight:700;animation:pop .6s}
@keyframes pop{from{transform:scale(0)}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:12px;position:relative;z-index:3}
.chip{background:var(--card);border:3px solid hsl(var(--h) 80% 60%);border-radius:20px;padding:8px 14px;text-align:center;cursor:grab;user-select:none;box-shadow:0 6px 0 hsl(var(--h) 70% 55%/.35);min-width:78px;animation:pop .5s backwards}
.chip:nth-child(2){animation-delay:.1s}.chip:nth-child(3){animation-delay:.2s}.chip:nth-child(4){animation-delay:.3s}.chip:nth-child(5){animation-delay:.4s}.chip:nth-child(6){animation-delay:.5s}
.chip.up{cursor:grabbing;z-index:20;box-shadow:0 14px 24px #0004}.chip.gone{opacity:0;pointer-events:none;transition:opacity .3s}
.chip .e,.f{display:block;font-size:40px;animation:bob 2.4s ease-in-out infinite}.chip b{font-size:18px}
@keyframes bob{50%{transform:translateY(-7px) rotate(5deg)}}
.card{background:var(--card);border-radius:20px;padding:12px 16px;margin:14px 0;box-shadow:0 4px 14px #0001;font-size:clamp(16px,2vw,21px);animation:in .7s .3s backwards}
.say{border-left:8px solid hsl(var(--h) 80% 55%);font-size:clamp(20px,2.6vw,30px);font-weight:700}
.vis{position:relative;min-height:260px;display:flex;justify-content:center;align-items:center}
.pic{max-width:100%;max-height:48vh;border-radius:26px;box-shadow:0 10px 30px #0003;cursor:grab;touch-action:none;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.sc{position:absolute;touch-action:none;cursor:grab}.sc .f{font-size:clamp(48px,8vw,88px)}
.tb{border-collapse:separate;border-spacing:0 8px;width:100%;max-width:900px;font-size:clamp(14px,1.9vw,20px)}
.tb td,.tb th{background:var(--card);padding:9px 14px;text-align:left}.tb th{background:hsl(var(--h) 80% 55%);color:#fff}
.tb td:first-child,.tb th:first-child{border-radius:14px 0 0 14px}.tb td:last-child,.tb th:last-child{border-radius:0 14px 14px 0}
.tb tr.k{cursor:pointer;transition:transform .2s}.tb tr.k:hover{transform:scale(1.02)}
.bar{height:16px;border-radius:9px;background:hsl(var(--h) 80% 55%);animation:grow 1.2s .3s backwards}@keyframes grow{from{width:0!important}}
.bins{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
.bin{flex:1;min-width:130px;border:4px dashed var(--c);border-radius:22px;padding:10px;text-align:center;background:var(--card)}.be{font-size:44px}.n{display:block;font-size:26px;font-weight:800;color:var(--c)}
.big{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70%}
.big h1{font-size:clamp(34px,7vw,80px);background:linear-gradient(90deg,#e5534b,#f5b301,#22a06b,#3b82f6,#a855f7,#e5534b);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 6s linear infinite}@keyframes rb{to{background-position:300%}}
.fl{position:absolute;font-size:clamp(30px,6vw,64px);animation:fly 7s ease-in-out infinite;pointer-events:none}@keyframes fly{50%{transform:translateY(-30px) rotate(15deg)}}
.song{display:inline-block;background:var(--card);border-radius:18px;padding:10px 16px;margin:6px;font-size:clamp(15px,2vw,22px);animation:pop .5s backwards;transition:transform .2s}.song:hover{transform:rotate(-3deg) scale(1.08)}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--card);box-shadow:0 -4px 16px #0002;z-index:30}
#nav button{font:inherit;font-size:20px;border:0;border-radius:99px;padding:6px 20px;background:hsl(var(--h) 80% 55%);color:#fff;cursor:pointer}
#nav button:active{transform:scale(.92)}#cnt{min-width:70px;text-align:center;font-weight:700}
.slide.dk{color:#fff}.dk .mut,.dk small{color:#e8e8ff}.chip,.card,.song,.tb td,.bin,.stp{color:var(--ink)}
.slide>:not(.fxl){position:relative;z-index:1}
.fxl{position:fixed;left:0;right:0;top:0;bottom:58px;overflow:hidden;pointer-events:none;z-index:0}
.fy{position:absolute;left:0;white-space:nowrap;animation:drift linear infinite}@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(110vw)}}
.dr{position:absolute;top:-30px;width:2px;height:20px;background:#cfe8ff;opacity:.7;animation:dfall linear infinite}.ef{position:absolute;top:-40px;animation:dfall linear infinite}@keyframes dfall{to{transform:translateY(115vh) rotate(90deg)}}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2s infinite}@keyframes tw{50%{opacity:.1}}
.sun{position:absolute;left:50%;margin-left:-80px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:radial-gradient(#fff6b8,#ffb703 60%,transparent 70%);animation:rise 7s ease-out forwards}@keyframes rise{to{transform:translateY(-170px)}}
.gr{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;font-size:54px}.gr span{transform-origin:bottom;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:rotate(7deg)}}
.gt{cursor:grab;touch-action:none}.gt .f{font-size:clamp(46px,8vw,84px)}
.stp{background:var(--card);border-radius:20px;padding:10px 14px;text-align:center;min-width:110px;font-size:clamp(14px,1.8vw,19px);animation:pop .5s backwards}.stp:nth-child(2){animation-delay:.15s}.stp:nth-child(3){animation-delay:.3s}.stp:nth-child(4){animation-delay:.45s}.stp:nth-child(5){animation-delay:.6s}
@keyframes wv{50%{transform:skewY(3deg) scaleX(.96)}}
@media (max-width:600px){
  .slide{inset:0 0 calc(58px + env(safe-area-inset-bottom,0px)) 0;padding:14px 14px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .g{grid-template-columns:minmax(0,1fr);gap:10px}
  .g>*{min-width:0}
  .vis{min-height:190px;max-height:none}
  .pic{max-height:34vh;touch-action:none}
  .chips{gap:9px}
  .chip{min-width:64px;padding:7px 10px}
  .chip .e{font-size:34px}
  .tb{font-size:14px}
  .tb td,.tb th{padding:8px 7px}
  #nav{gap:9px}
  #nav button{font-size:18px;padding:8px 15px;min-width:42px;min-height:42px;touch-action:manipulation}
  #cnt{min-width:58px;font-size:14px}
  h1{overflow-wrap:anywhere}
}
@media (max-width:360px){
  .slide{padding-left:10px;padding-right:10px}
  #nav{gap:5px}
  #nav button{padding:7px 11px}
  .tb{font-size:12px}
}
</style></head><body><div id="app"><div id="stage"></div><div id="nav"><button id="pv">◀</button><span id="cnt"></span><button id="nx">▶</button><button id="fs">⛶</button></div></div>

function say(w){try{if(!w)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function burst(x,y,n=10){const E=["⭐","✨","🎉","💛","🌟"];for(let i=0;i<n;i++){const s=document.createElement("span");s.textContent=E[i%5];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:24px;pointer-events:none;z-index:99`;document.body.append(s);const a=Math.random()*6.28,d=60+Math.random()*130;s.animate([{transform:"translate(0,0) scale(.5)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) scale(1.4)`,opacity:0}],{duration:900,easing:"ease-out"}).onfinish=()=>s.remove()}}
function drag(el,cb){let x=0,y=0,sx,sy,on=0,m=0;el.style.touchAction="none";
el.onpointerdown=e=>{on=1;m=0;sx=e.clientX-x;sy=e.clientY-y;el.setPointerCapture(e.pointerId);el.style.transition="none";el.classList.add("up")};
el.onpointermove=e=>{if(!on)return;const nx=e.clientX-sx,ny=e.clientY-sy;if(Math.abs(nx-x)+Math.abs(ny-y)>3)m=1;x=nx;y=ny;el.style.transform=`translate(${x}px,${y}px) rotate(${x/25}deg)`};
el.onpointerup=e=>{if(!on)return;on=0;el.classList.remove("up");el.style.transition="transform .55s cubic-bezier(.3,1.7,.5,1)";
if(!m)say(el.dataset.w);else if(cb&&cb(el,e)==="back"){x=y=0}else if(!cb)burst(e.clientX,e.clientY,4);
el.style.transform=`translate(${x}px,${y}px)`}}
